name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish a verified release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Java tests
        run: scripts/test-java.sh
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Bundle linux-x86_64
        run: scripts/bundle.sh --output dist

      - name: Verify checksums and self-test
        run: |
          cd dist/ZOROWARRIOR-Rust-Server-*
          sha256sum -c SHA256SUMS
          java -jar ZOROWARRIOR-Rust-Server.jar --selftest

      - name: Persistence acceptance
        run: |
          jar=$(ls dist/*/ZOROWARRIOR-Rust-Server.jar | head -1)
          python3 scripts/acceptance_persistence.py --jar "$jar"

      - name: Package
        run: |
          cd dist
          for dir in ZOROWARRIOR-Rust-Server-*/; do
            tar czf "${dir%/}.tar.gz" "$dir"
            ( cd "$dir" && sha256sum -c SHA256SUMS )
          done
          sha256sum *.tar.gz > release-SHA256SUMS
          cat release-SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/release-SHA256SUMS
          body: |
            ZOROWARRIOR Rust Server ${{ github.ref_name }}

            The JAR loads and manages the Rust engine; the Rust engine runs the server.

            Included: linux-x86_64 (JAR + native engine + SHA256SUMS).

            Not implemented in this release: play-state packets (world, movement,
            inventory, chat), online-mode authentication, Bukkit API execution and
            WASM plugin execution. See docs/COMPATIBILITY.md for the verified matrix.

            Always verify `sha256sum -c SHA256SUMS` before running.
          draft: false
