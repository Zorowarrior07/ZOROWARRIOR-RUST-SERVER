name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (fmt, check, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --all-targets --locked
      # Advisory: this tree was written without a local rustfmt/clippy, so it is
      # not guaranteed to be lint-clean yet. Tests and build are the hard gates.
      - name: Formatting (advisory)
        continue-on-error: true
        run: cargo fmt --all --check
      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked
      - name: Tests
        run: cargo test --workspace --locked

  java:
    name: Java launcher and JNI integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build native engine
        run: cargo build --release --locked -p zwrs-jni
      - name: Java tests (includes real JNI integration)
        run: scripts/test-java.sh --skip-native
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

  acceptance:
    name: Player persistence acceptance
    runs-on: ubuntu-latest
    needs: [rust, java]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bundle
        run: scripts/bundle.sh --output dist
      - name: Verify checksums
        run: |
          cd dist/ZOROWARRIOR-Rust-Server-*
          sha256sum -c SHA256SUMS
      - name: Bridge self-test
        run: java -jar ZOROWARRIOR-Rust-Server.jar --selftest
        working-directory: dist/ZOROWARRIOR-Rust-Server-0.1.0-linux-x86_64
      - name: Persistence acceptance
        run: |
          jar=$(ls dist/*/ZOROWARRIOR-Rust-Server.jar | head -1)
          python3 scripts/acceptance_persistence.py --jar "$jar"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zwrs-linux-x86_64
          path: dist/ZOROWARRIOR-Rust-Server-*/
          if-no-files-found: error
